name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"

jobs:
  back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v3
      - name: build & test
        working-directory: back
        run: ./gradlew build jacocoTestReport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: back-reports
          path: |
            back/build/libs/*.jar
            back/build/reports/**
            back/build/test-results/**
            back/build/jacoco/**
          retention-days: 14

  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: install
        working-directory: front
        run: npm ci
      - name: test
        working-directory: front
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage
      - name: build
        working-directory: front
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: front-reports
          path: |
            front/dist/**
            front/coverage/**
          retention-days: 14

  sonar:
    needs: [back, front]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v3
      - name: back build + coverage
        working-directory: back
        run: ./gradlew build jacocoTestReport
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: front install + coverage
        working-directory: front
        run: |
          npm ci
          npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage
      - name: sonar scan
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-smoke:
    needs: [back, front]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build & start
        run: docker compose up --build -d
      - name: wait for services
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/persons >/dev/null && curl -sf http://localhost/ >/dev/null; then
              echo "services ready"
              exit 0
            fi
            sleep 2
          done
          echo "services did not become ready in time"
          exit 1
      - name: probe back
        run: curl -sf http://localhost:8080/persons | head -c 400
      - name: probe front
        run: curl -sf http://localhost/ | head -c 400
      - name: dump logs on failure
        if: failure()
        run: docker compose logs
      - name: teardown
        if: always()
        run: docker compose down -v

  trivy:
    needs: docker-smoke
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: build back image
        run: docker build -t microcrm-back:ci ./back
      - name: build front image
        run: docker build -t microcrm-front:ci ./front
      - name: scan back
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: microcrm-back:ci
          format: sarif
          output: trivy-back.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: scan front
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: microcrm-front:ci
          format: sarif
          output: trivy-front.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: upload back sarif
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-back.sarif
          category: trivy-back
      - name: upload front sarif
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-front.sarif
          category: trivy-front
