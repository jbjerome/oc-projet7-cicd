name: rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer tag to roll back to (ex: v0.1.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  retag-latest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [back, front]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: retag ${{ matrix.service }} as latest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/microcrm-${{ matrix.service }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/microcrm-${{ matrix.service }}:${{ inputs.version }}
